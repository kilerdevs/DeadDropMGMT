# nginx stack: nginx (static + FastCGI front) + PHP-FPM image + MariaDB.
#   docker compose -f docker-compose.nginx.yml up -d --build
#
# The fpm service's docroot is a named volume: the fpm entrypoint refreshes the
# code in it from the image on EVERY start (Docker alone seeds a named volume
# only once, so rebuilt code would never arrive), keeping config.php and the
# runtime dirs. The web container mounts it read-only for static files, plus
# the photo volume, so it can serve CSS/JS/fonts/photos without duplicating
# the app.

name: deaddrop-nginx

services:
  db:
    image: mariadb:13@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-deaddrop-root}
      MARIADB_DATABASE: deaddrops
      MARIADB_USER: deaddrop
      MARIADB_PASSWORD: ${DB_PASS:-deaddrop-db}
    volumes:
      - db-data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  fpm:
    build:
      context: .
      dockerfile: Dockerfile.fpm
      args:
        DDMGMT_BUILD_INFO: ${DDMGMT_BUILD_INFO:-}
    restart: unless-stopped
    environment:
      DDMGMT_DB_HOST: db
      DDMGMT_DB_PORT: "3306"
      DDMGMT_DB_NAME: deaddrops
      DDMGMT_DB_USER: deaddrop
      DDMGMT_DB_PASS: ${DB_PASS:-deaddrop-db}
      DDMGMT_AES_KEY_HEX: ${DDMGMT_AES_KEY_HEX:-}
      DDMGMT_SETUP_TOKEN: ${DDMGMT_SETUP_TOKEN:-}
      # Automatic OSM proxy discovery (first-run seeding + replacing failed
      # proxies) and the page-visit pseudo-cron: 0 turns either one off.
      DDMGMT_PROXY_HEAL: ${DDMGMT_PROXY_HEAL:-1}
      DDMGMT_PSEUDO_CRON: ${DDMGMT_PSEUDO_CRON:-1}
    volumes:
      - app-src:/var/www/html        # code refreshed from the image on every start…
      - app-uploads:/var/www/html/uploads
      - app-logs:/var/www/html/logs
      - app-cache:/var/www/html/cache
      - app-config:/config
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236   # 1.27 is end-of-life
    restart: unless-stopped
    ports:
      - "${APP_PORT:-2137}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-src:/var/www/html:ro     # …and shared here for static files
      - app-uploads:/var/www/html/uploads:ro  # photos live in their own volume
    depends_on:
      - fpm

volumes:
  db-data:
  app-src:
  app-uploads:
  app-logs:
  app-cache:
  app-config:
