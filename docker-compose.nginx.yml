# nginx stack: nginx (static + FastCGI front) + PHP-FPM image + MariaDB.
#   docker compose -f docker-compose.nginx.yml up -d --build
#
# The fpm service's docroot is a named volume: on first run Docker populates it
# from the image, and the web container mounts the same volume read-only so it
# can serve CSS/JS/fonts/photos without duplicating the app.

name: deaddrop-nginx

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-deaddrop-root}
      MARIADB_DATABASE: deaddrops
      MARIADB_USER: deaddrop
      MARIADB_PASSWORD: ${DB_PASS:-deaddrop-db}
    volumes:
      - db-data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  fpm:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    restart: unless-stopped
    environment:
      DDMGMT_DB_HOST: db
      DDMGMT_DB_PORT: "3306"
      DDMGMT_DB_NAME: deaddrops
      DDMGMT_DB_USER: deaddrop
      DDMGMT_DB_PASS: ${DB_PASS:-deaddrop-db}
    volumes:
      - app-src:/var/www/html        # populated from the image on first use…
      - app-uploads:/var/www/html/uploads
      - app-logs:/var/www/html/logs
      - app-cache:/var/www/html/cache
      - app-config:/config
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-2137}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-src:/var/www/html:ro     # …and shared here for static files
    depends_on:
      - fpm

volumes:
  db-data:
  app-src:
  app-uploads:
  app-logs:
  app-cache:
  app-config:
