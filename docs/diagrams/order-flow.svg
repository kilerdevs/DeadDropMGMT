<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#3fb950" stroke-width="1.6"/>
    </marker>
  </defs>
  <!-- lanes -->
  <line x1="130" y1="64" x2="130" y2="446" stroke="#484f58" stroke-dasharray="5 4"/>
  <line x1="380" y1="64" x2="380" y2="446" stroke="#484f58" stroke-dasharray="5 4"/>
  <line x1="630" y1="64" x2="630" y2="446" stroke="#484f58" stroke-dasharray="5 4"/>
  <rect x="30" y="18" width="200" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Owner / Courier</text>
  <text x="130" y="53" text-anchor="middle" font-size="11" fill="#9aa4b2">actor</text>
  <rect x="280" y="18" width="200" height="46" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="380" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">App + database</text>
  <text x="380" y="53" text-anchor="middle" font-size="11" fill="#9aa4b2">participant</text>
  <rect x="530" y="18" width="200" height="46" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="630" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Recipient</text>
  <text x="630" y="53" text-anchor="middle" font-size="11" fill="#9aa4b2">actor</text>
  <!-- 1 -->
  <rect x="158" y="78" width="194" height="23" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="255" y="94" text-anchor="middle" font-size="12" fill="#e6edf3">Create order (pin, photos)</text>
  <line x1="130" y1="107" x2="372" y2="107" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- note -->
  <rect x="282" y="119" width="196" height="40" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#e8c872">Location encrypted,</text>
  <text x="380" y="151" text-anchor="middle" font-size="11.5" fill="#e8c872">passphrase hashed</text>
  <!-- 2 -->
  <rect x="163" y="170" width="184" height="23" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="255" y="186" text-anchor="middle" font-size="12" fill="#e6edf3">Passphrase shown once</text>
  <line x1="372" y1="199" x2="138" y2="199" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#ahg)"/>
  <!-- 3 -->
  <rect x="144" y="210" width="222" height="23" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="255" y="226" text-anchor="middle" font-size="12" fill="#e6edf3">Mark delivered (TTL starts)</text>
  <line x1="130" y1="239" x2="372" y2="239" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 4 -->
  <rect x="425" y="250" width="160" height="23" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="505" y="266" text-anchor="middle" font-size="12" fill="#e6edf3">Look up by token</text>
  <line x1="630" y1="279" x2="388" y2="279" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 5 -->
  <rect x="408" y="290" width="194" height="39" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="505" y="305" text-anchor="middle" font-size="12" fill="#e6edf3">Unlock with passphrase</text>
  <text x="505" y="320" text-anchor="middle" font-size="11" fill="#9aa4b2">(CSRF + rate limits)</text>
  <line x1="630" y1="335" x2="388" y2="335" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 6 -->
  <rect x="395" y="346" width="220" height="39" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="505" y="361" text-anchor="middle" font-size="12" fill="#e6edf3">Reveal map and photos</text>
  <text x="505" y="376" text-anchor="middle" font-size="11" fill="#9aa4b2">(decrypted server-side)</text>
  <line x1="388" y1="391" x2="622" y2="391" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#ahg)"/>
  <!-- 7 -->
  <rect x="430" y="402" width="150" height="23" rx="9" fill="#0d1117" stroke="#30363d"/>
  <text x="505" y="418" text-anchor="middle" font-size="12" fill="#e6edf3">Confirm receipt</text>
  <line x1="630" y1="431" x2="388" y2="431" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- note -->
  <rect x="282" y="443" width="196" height="24" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="380" y="459" text-anchor="middle" font-size="11.5" fill="#e8c872">Order, photos and events deleted</text>
</svg>
