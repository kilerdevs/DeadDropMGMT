<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect x="1" y="1" width="758" height="468" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    </marker>
    <marker id="ahg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#16a34a" stroke-width="1.6"/>
    </marker>
  </defs>
  <!-- lanes -->
  <line x1="130" y1="64" x2="130" y2="446" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <line x1="380" y1="64" x2="380" y2="446" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <line x1="630" y1="64" x2="630" y2="446" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <rect x="30" y="18" width="200" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Owner / Courier</text>
  <text x="130" y="53" text-anchor="middle" font-size="11" fill="#475569">actor</text>
  <rect x="280" y="18" width="200" height="46" rx="8" fill="#e0e7ff" stroke="#4338c9" stroke-width="1.5"/>
  <text x="380" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">App + database</text>
  <text x="380" y="53" text-anchor="middle" font-size="11" fill="#475569">participant</text>
  <rect x="530" y="18" width="200" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Recipient</text>
  <text x="630" y="53" text-anchor="middle" font-size="11" fill="#475569">actor</text>
  <!-- 1 -->
  <text x="255" y="92" text-anchor="middle" font-size="12" fill="#1f2937">Create order (pin, photos)</text>
  <line x1="130" y1="98" x2="372" y2="98" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- note -->
  <rect x="282" y="110" width="196" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="127" text-anchor="middle" font-size="11.5" fill="#92400e">Location encrypted,</text>
  <text x="380" y="142" text-anchor="middle" font-size="11.5" fill="#92400e">passphrase hashed</text>
  <!-- 2 -->
  <text x="255" y="176" text-anchor="middle" font-size="12" fill="#1f2937">Passphrase shown once</text>
  <line x1="372" y1="182" x2="138" y2="182" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#ahg)"/>
  <!-- 3 -->
  <text x="255" y="216" text-anchor="middle" font-size="12" fill="#1f2937">Mark delivered (TTL starts)</text>
  <line x1="130" y1="222" x2="372" y2="222" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 4 -->
  <text x="505" y="256" text-anchor="middle" font-size="12" fill="#1f2937">Look up by token</text>
  <line x1="630" y1="262" x2="388" y2="262" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 5 -->
  <text x="505" y="292" text-anchor="middle" font-size="12" fill="#1f2937">Unlock with passphrase</text>
  <text x="505" y="306" text-anchor="middle" font-size="11" fill="#64748b">(CSRF + rate limits)</text>
  <line x1="630" y1="312" x2="388" y2="312" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- 6 -->
  <text x="505" y="342" text-anchor="middle" font-size="12" fill="#1f2937">Reveal map and photos</text>
  <text x="505" y="356" text-anchor="middle" font-size="11" fill="#64748b">(decrypted server-side)</text>
  <line x1="388" y1="362" x2="622" y2="362" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#ahg)"/>
  <!-- 7 -->
  <text x="505" y="392" text-anchor="middle" font-size="12" fill="#1f2937">Confirm receipt</text>
  <line x1="630" y1="398" x2="388" y2="398" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- note -->
  <rect x="282" y="410" width="196" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="380" y="427" text-anchor="middle" font-size="11.5" fill="#92400e">Order, photos and</text>
  <text x="380" y="442" text-anchor="middle" font-size="11.5" fill="#92400e">events deleted</text>
</svg>
