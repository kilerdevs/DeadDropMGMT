# nginx snippet for DeadDropMGMT
#
# .htaccess protects these paths on Apache only. On nginx nothing reads
# .htaccess, so WITHOUT the block below all of the following are directly
# downloadable: setup.sql, logs/*.log, config.php.example, tests/, cron/,
# tools/, docker/, e2e/, backups/ and the tile/session caches.
#
# The cron/ and tests/ scripts additionally refuse non-CLI SAPIs themselves,
# so a server that ignores even this snippet still cannot be made to RUN
# them — but setup.sql and the logs must never be served. Adapt `root` and
# `server_name`, then `nginx -t && nginx -s reload`.

server {
    listen 80;
    server_name example.com;
    root /var/www/deaddropmgmt;

    index index.php;

    # PHP entry points only — everything else under /admin/ is static.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never serve: app internals, dev/ops material, caches, backups, logs.
    # This mirrors .htaccess EXACTLY — tiles/ and uploads/ stay servable on
    # purpose (token-capability zone files, photo links), as on Apache.
    location ~ ^/(includes|logs|cache|cron|tools|docker|e2e|tests|backups|data|\.semgrep|\.github)/ {
        deny all;
        return 404;
    }

    # Never serve: sensitive single files (mirror of .htaccess). INSTALL_UNLOCK
    # holds the installer's rotating upgrade token — it must never be served.
    location ~ ^/(setup\.sql|build-info\.json|composer\.(json|lock)|package(-lock)?\.json|playwright\.config\.js|phpstan\.neon|\.php-cs-fixer\.php|auto-update\.(sh|log)|config\.php\.example|Dockerfile[^/]*|docker-compose[^/]*\.yml|config\.php|INSTALL_UNLOCK)$ {
        deny all;
        return 404;
    }

    # Zone files: only secret-named *.pmtiles are servable — never guessable
    # legacy names, partial downloads or pure-PHP engine sidecars.
    location ~* ^/tiles/(zone_[0-9]+\.(pmtiles|part)|.*\.(part|plan|tiles|tmp))$ {
        deny all;
        return 404;
    }

    # Uploaded photos never execute, whatever their name.
    location ~* ^/uploads/.+\.(php[0-9]?|phtml|phar)$ {
        deny all;
        return 404;
    }

    # Dotfiles and VCS metadata (.git/, .env, ...), except .well-known.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
