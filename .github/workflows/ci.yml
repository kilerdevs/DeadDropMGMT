name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

# Jobs here need no write access — read-only by default, so a compromised
# workflow or action cannot touch the repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # README promises PHP 8.0+ — test the whole supported range.
    # fail-fast so one broken version doesn't hide results from the others.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    name: tests (PHP ${{ matrix.php }})
    services:
      # setup.sql uses MariaDB syntax (ALTER TABLE ... ADD COLUMN IF NOT EXISTS)
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_test
    steps:
      # Third-party actions are pinned to commit SHAs, not moving tags: a
      # hijacked tag must not be able to run code in this repo.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, gd, fileinfo

      # config.php is gitignored — CI builds it from the committed template,
      # secrets arrive via the DDMGMT_* environment variables (secret store).
      - name: Prepare config
        run: cp config.php.example config.php

      - name: Lint
        run: git ls-files '*.php' | xargs -n1 php -l > /dev/null

      - name: Load schema into test database
        run: php tests/schema_loader.php

      - name: Run tests
        run: php tests/run_all.php

  # Line coverage over includes/ (the security-critical library code).
  # Separate job: needs pcov + the dev-only Composer dependency (ADR-001 keeps
  # runtime dependency-free; composer.json is tooling, never shipped).
  # The job also ENFORCES coverage floors: overall includes/ >= 80% and every
  # security-critical file >= 90% — a regression is a failed build, not a
  # quieter number on a report nobody reads.
  coverage:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, gd, fileinfo
          coverage: pcov

      - name: Prepare config
        run: cp config.php.example config.php

      - name: Install dev tooling
        run: composer install --no-interaction --no-progress

      # Dev dependencies are still dependencies: audit them on every build.
      - name: Audit dev dependencies
        run: composer audit

      - name: Load schema
        run: php tests/schema_loader.php

      - name: Run tests with coverage
        run: |
          php tests/coverage_runner.php --html=coverage-html \
               --min-overall=80 --min-critical=90 | tee coverage.txt
          grep -oP "Lines:\s+\K[\d.]+" coverage.txt | head -1 | \
            { read pct; echo "### Line coverage: ${pct}%" >> $GITHUB_STEP_SUMMARY; } || true

      - name: Upload HTML report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

  # Docker isn't installed on the maintainer's machine — these jobs are the
  # only place the images and compose stacks actually get exercised.
  docker:
    runs-on: ubuntu-latest
    env:
      DDMGMT_DB_HOST: db
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: deaddrop
      DDMGMT_DB_PASS: deaddrop-db
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build Apache image
        run: docker build -t deaddrop:apache .

      - name: Build PHP-FPM image
        run: docker build -f Dockerfile.fpm -t deaddrop:fpm .

      # Vulnerability scan of the shipped image: HIGH/CRITICAL findings with
      # a fix available fail the build — bumping the base image is the fix.
      - name: Scan Apache image (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: deaddrop:apache
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.nginx.yml config -q
          docker compose -f docker-compose.caddy.yml config -q

      # Smoke test = boot the full stack, wait for the public page to render.
      # On failure dump container state + logs, or the failure stays a mystery.
      - name: Smoke test (Apache)
        run: |
          trap 'docker compose ps -a; echo "--- APP LOGS ---"; docker compose logs --no-color app' ERR
          docker compose up -d --build --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          docker compose down -v

      - name: Smoke test (nginx + fpm)
        run: |
          docker compose -f docker-compose.nginx.yml up -d --build --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/includes/db.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/config.php)" = 403 ]
          docker compose -f docker-compose.nginx.yml down -v

      - name: Smoke test (Caddy + fpm)
        run: |
          docker compose -f docker-compose.caddy.yml up -d --build --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/includes/db.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/config.php)" = 403 ]
          docker compose -f docker-compose.caddy.yml down -v
