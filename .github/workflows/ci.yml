name: CI

concurrency:
  # The same commit runs as push:dev AND pull_request; a release fans out to
  # three full 13-job runs. Sharing one group per ref stops the pile-up
  # (queued test jobs waited ~60 s in run 36345330215). Master runs to
  # completion — cancelling a release build mid-deploy is worse than waiting.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: [master, dev]
  pull_request:

# Jobs here need no write access — read-only by default, so a compromised
# workflow or action cannot touch the repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    # README promises PHP 8.2+ (8.0/8.1 are EOL — testing them would bless
    # unpatched runtimes). 8.5 is in the matrix because the shipped Docker
    # images already run it — the production runtime must never go untested.
    # fail-fast so one broken version doesn't hide results from the others.
    # One matrix, three concerns: the PHP axis, MySQL 8 portability (setup.sql
    # must stay portable — guarded ALTERs, no engine-only syntax), and the
    # shipped mariadb:13 under Europe/Warsaw TZ (the UTC-default runner once
    # let a UTC-write/local-read limiter skew through untested).
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            db: 'mariadb:11'
            tz: ''
            label: 'PHP 8.2 · mariadb:11'
          - php: '8.3'
            db: 'mariadb:11'
            tz: ''
            label: 'PHP 8.3 · mariadb:11'
          - php: '8.4'
            db: 'mariadb:11'
            tz: ''
            label: 'PHP 8.4 · mariadb:11'
          - php: '8.5'
            db: 'mariadb:11'
            tz: ''
            label: 'PHP 8.5 · mariadb:11'
          - php: '8.3'
            db: 'mysql:8.0'
            tz: ''
            label: 'PHP 8.3 · mysql:8.0'
          - php: '8.3'
            db: 'mariadb:13'
            tz: 'Europe/Warsaw'
            label: 'PHP 8.3 · mariadb:13 · Europe/Warsaw TZ'
    name: tests (${{ matrix.label }})
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot 2>/dev/null || healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_test
      TZ: ${{ matrix.tz }}
    steps:
      # Third-party actions are pinned to commit SHAs, not moving tags: a
      # hijacked tag must not be able to run code in this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, gd, fileinfo

      # config.php is gitignored — CI builds it from the committed template,
      # secrets arrive via the DDMGMT_* environment variables (secret store).
      - name: Prepare config
        run: cp config.php.example config.php

      - name: Lint
        run: git ls-files '*.php' | xargs -n1 -P"$(nproc)" php -l > /dev/null

      - name: Load schema into test database
        run: php tests/schema_loader.php

      # setup.sql promises re-running is a harmless no-op (the upgrade path
      # for existing installs) — prove it every build by loading twice.
      - name: Reload schema (idempotency proof)
        run: php tests/schema_loader.php

      - name: Run tests
        run: php tests/run_all.php

  # Static analysis (PHPStan level 5) over the runtime code. The phar is
  # version- AND hash-pinned: a compromised release must not analyse — or
  # worse, pass — this repo's code.
  phpstan:
    runs-on: ubuntu-24.04
    name: PHPStan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, gd, fileinfo

      - name: Prepare config
        run: cp config.php.example config.php

      - name: Run PHPStan
        run: |
          curl -fsSL -o phpstan.phar \
            https://github.com/phpstan/phpstan/releases/download/2.2.9/phpstan.phar
          echo "42af2954326f2f6f0c39e12eb0e1229b9e037297e2caec9a5db11d44e4f6cce1  phpstan.phar" | sha256sum -c -
          php phpstan.phar analyse --no-progress

  # Automated formatting gate: the tree must already conform to
  # .php-cs-fixer.php — the fixer runs read-only (--dry-run) and any
  # violation fails the build. Fix locally before pushing:
  #   php php-cs-fixer.phar fix
  # Tool is version- AND hash-pinned like PHPStan: a compromised release
  # must not rewrite — or wave through — this repo's code.
  style:
    runs-on: ubuntu-24.04
    name: Code style
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'

      - name: Run PHP-CS-Fixer (dry-run)
        run: |
          curl -fsSL -o php-cs-fixer.phar \
            https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v3.95.25/php-cs-fixer.phar
          echo "80cad475fc5112fdbfab8bd66e51665ed78c1b849b918dab81fb63b7a7003b41  php-cs-fixer.phar" | sha256sum -c -
          php php-cs-fixer.phar fix --config=.php-cs-fixer.php --dry-run --diff --show-progress=none

  # Line coverage over includes/ (the security-critical library code).
  # Separate job: needs pcov + the dev-only Composer dependency (ADR-001 keeps
  # runtime dependency-free; composer.json is tooling, never shipped).
  # The job also ENFORCES coverage floors: overall includes/ >= 85% and every
  # security-critical file >= 85% (db.php 80 — its residual lines are the
  # connect-failure die(); proxy.php 63 — live discovery stays external) —
  # a regression is a failed build, not a quieter number on a report nobody
  # reads. Exact pins live on the command line below.
  coverage:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, gd, fileinfo
          coverage: pcov

      - name: Prepare config
        run: cp config.php.example config.php

      - name: Install dev tooling
        run: composer install --no-interaction --no-progress

      # Dev dependencies are still dependencies: audit them on every build.
      - name: Audit dev dependencies
        run: composer audit

      - name: Load schema
        run: php tests/schema_loader.php

      - name: Run tests with coverage
        run: |
          # pipefail: a fatal inside the runner must fail the job even though
          # tee (the last pipeline command) exits 0 — this exact masking hid a
          # coverage crash once while the job stayed green.
          set -o pipefail
          # Floors: criticals at 85% (auth 93%, crypto 93%, order_state 92%,
          # totp 98%, wipe 91%, logger 93% as measured 2026-09-16) and 85%
          # overall across includes/ — the FailClosed/I18n/Logger/Settings/
          # ProxyClient suites closed the pcov blind spots that HTTP-driven
          # paths left open. Per-file pins lock the hermetic gains: net 100
          # (pure CIDR/IP logic), cleanup 85 (dice+pass split testable; the
          # three load-time require lines are structurally uncoverable — the
          # test bootstrap loads every include before recording starts),
          # proxy 63 (stub-as-proxy winner/judge paths; live discovery stays
          # external by design). db.php overrides to 80: its residual lines
          # are the connect-failure die() itself, which cannot execute inside
          # this single-process collector; that path is covered behaviourally
          # by the smoke tests instead. The gate fails on ANY regression.
          php tests/coverage_runner.php --html=coverage-html \
               --min-overall=85 --min-critical=85 --min-file=db.php:80 \
               --min-file=logger.php:92 --min-file=net.php:100 \
               --min-file=cleanup.php:85 --min-file=proxy.php:63 | tee coverage.txt
          grep -oP "Lines:\s+\K[\d.]+" coverage.txt | head -1 | \
            { read pct; echo "### Line coverage: ${pct}%" >> $GITHUB_STEP_SUMMARY; } || true

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

  # Mutation probe (REPORT-ONLY trial): tools/mutation_probe.php applies
  # curated logic-weakening mutants to the security-critical library code and
  # requires the suite to kill every one — line coverage alone cannot show
  # that a guard is actually tested. Report-only while the MSI baseline
  # proves stable across PHP/DB variance: the probe exits nonzero only when
  # its own anchors break (maintenance signal), never on a survived mutant,
  # and continue-on-error is belt-and-braces so a slow run cannot block the
  # build. Gate (minimum MSI) only after the number earns it. Needs the DB
  # because the killer suites are the DB-backed in-process ones; no coverage
  # driver, no Composer tooling — the probe is dependency-free like the app.
  mutation:
    runs-on: ubuntu-24.04
    name: Mutation probe (report-only)
    # Report-only signal, not a merge gate: dev pushes and the weekly sweep
    # are enough to watch the MSI trend; PRs and release builds skip it.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, gd, fileinfo

      - name: Prepare config
        run: cp config.php.example config.php

      - name: Load schema
        run: php tests/schema_loader.php

      - name: Run mutation probe
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          php tools/mutation_probe.php | tee mutation.txt
          grep -oP "MSI \K[\d.]+" mutation.txt | head -1 | \
            { read msi; echo "### Mutation score: ${msi}% (report-only)" >> $GITHUB_STEP_SUMMARY; } || true

      - name: Upload probe report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: mutation.txt
          retention-days: 14

  # Docker isn't installed on the maintainer's machine — these jobs are the
  # only place the images and compose stacks actually get exercised. Two
  # parallel jobs, each building once from the shared GHA layer cache (same
  # inputs, same layers): image-scan holds the CVE/SBOM gates, smoke-dast
  # the boot/journey/ZAP proofs. The aggregate `docker` job below keeps the
  # branch-protection check name stable no matter which half is skipped.
  image-scan:
    runs-on: ubuntu-24.04
    name: image scan (Grype + SBOM)
    # Docs-only changes need no rebuild or vulnerability scan.
    paths-ignore: ['**.md', 'docs/**']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Weekly apt bust: the ISO week rides into the Dockerfiles as
      # APT_BUST, so the apt-get upgrade layer rebuilds against fresh
      # Debian packages instead of serving month-old cached layers.
      - name: Cache-bust week
        id: week
        run: echo "iso=$(date -u +%V)" >> "$GITHUB_OUTPUT"

      - name: Build Apache image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: deaddrop:apache
          cache-from: type=gha,scope=apache
          cache-to: type=gha,mode=max,scope=apache
          build-args: APT_BUST=${{ steps.week.outputs.iso }}

      - name: Build PHP-FPM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fpm
          load: true
          tags: deaddrop:fpm
          cache-from: type=gha,scope=fpm
          cache-to: type=gha,mode=max,scope=fpm
          build-args: APT_BUST=${{ steps.week.outputs.iso }}

      # Vulnerability scans of BOTH shipped images (the FPM image is what the
      # nginx and Caddy stacks actually run): HIGH/CRITICAL findings with a
      # fix available fail the build — bumping the base image is the fix.
      # Grype (via the Anchore actions, both SHA-pinned) replaces Trivy here:
      # same gate semantics, SBOMs from Syft in the same step family.
      - name: Scan Apache image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: deaddrop:apache
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          # The vuln DB download+install is ~90 s of every scan; cache it.
          cache-db: true

      - name: Scan FPM image (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: deaddrop:fpm
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
          cache-db: true

      # SBOM (CycloneDX) for both images — the inventory that makes the CVE
      # scans auditable and gives downstream deployers something to diff.
      # Written outside the workspace: files landing next to the Dockerfile
      # bust the COPY . layer cache, and the smoke job would then test an
      # image the scanner never saw (and serve the SBOM from its docroot).
      - name: Generate Apache SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: deaddrop:apache
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-apache.cdx.json

      - name: Generate FPM SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: deaddrop:fpm
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-fpm.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom-*.cdx.json
          retention-days: 30

  smoke-dast:
    runs-on: ubuntu-24.04
    name: smoke + DAST (compose + ZAP)
    paths-ignore: ['**.md', 'docs/**']
    env:
      DDMGMT_DB_HOST: db
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: deaddrop
      DDMGMT_DB_PASS: deaddrop-db
      # Keep the pipeline hermetic: no automatic proxy discovery (public list
      # downloads, probes) while the stacks boot. ProxyHealTest covers it.
      DDMGMT_PROXY_HEAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache-bust week
        id: week
        run: echo "iso=$(date -u +%V)" >> "$GITHUB_OUTPUT"

      # Same inputs + same GHA cache scopes as image-scan: the layers under
      # test are the layers Grype scanned. No --build below — compose uses
      # these prebuilt tags (image: in the compose files).
      - name: Build Apache image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: deaddrop:apache
          cache-from: type=gha,scope=apache
          cache-to: type=gha,mode=max,scope=apache
          build-args: APT_BUST=${{ steps.week.outputs.iso }}

      - name: Build PHP-FPM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fpm
          load: true
          tags: deaddrop:fpm
          cache-from: type=gha,scope=fpm
          cache-to: type=gha,mode=max,scope=fpm
          build-args: APT_BUST=${{ steps.week.outputs.iso }}

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.nginx.yml config -q
          docker compose -f docker-compose.caddy.yml config -q

      # Smoke test = boot the full stack, wait for the public page to render.
      # On failure dump container state + logs, or the failure stays a mystery.
      # Then the full-lifecycle journey runs INSIDE the container: first-run
      # owner creation → login → create → deliver → lookup → unlock →
      # receipt → assert wiped (docker/e2e_journey.php).
      - name: Smoke test + lifecycle journey (Apache)
        run: |
          trap 'docker compose ps -a; echo "--- APP LOGS ---"; docker compose logs --no-color app' ERR
          docker compose up -d --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          hz_body="$(curl -s http://127.0.0.1:2137/healthz.php)"
          [ "$hz_body" = "ok" ] || { echo "HEALTHZ MISMATCH:"; printf '%s\n' "$hz_body"; curl -si http://127.0.0.1:2137/healthz.php | head -12; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/cache/osm_tiles/0/0/0.png)" = 403 ]
          docker compose exec -T app php docker/e2e_journey.php
          docker compose down -v

      - name: Smoke test (nginx + fpm)
        run: |
          docker compose -f docker-compose.nginx.yml up -d --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          [ "$(curl -s http://127.0.0.1:2137/healthz.php)" = "ok" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/includes/db.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/config.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/cache/osm_tiles/0/0/0.png)" = 403 ]
          docker compose -f docker-compose.nginx.yml down -v

      - name: Smoke test (Caddy + fpm)
        run: |
          docker compose -f docker-compose.caddy.yml up -d --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/ >/dev/null; do sleep 2; done'
          curl -fs http://127.0.0.1:2137/ | grep -qi "<title>"
          [ "$(curl -s http://127.0.0.1:2137/healthz.php)" = "ok" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/includes/db.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/config.php)" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2137/cache/osm_tiles/0/0/0.png)" = 403 ]
          docker compose -f docker-compose.caddy.yml down -v

      # DAST: OWASP ZAP baseline (spider + passive analysis) against a live
      # Apache stack — public surface plus the admin login form it links to.
      # The stack is booted here because the smoke tests above tear theirs
      # down; ZAP runs with --network=host, so 127.0.0.1:2137 must be alive.
      # Regression-aware: docker/zap-rules.tsv IGNOREs exactly the findings
      # triaged as by-design (each with its reason in the file); anything NEW
      # fails the build. Re-triage whenever headers or pages change.
      - name: Boot stack for DAST
        run: |
          docker compose up -d --quiet-pull
          timeout 90 bash -c 'until curl -fs http://127.0.0.1:2137/healthz.php >/dev/null; do sleep 2; done'

      - name: ZAP baseline scan (gated)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:2137/'
          cmd_options: '-I -a -c /zap/wrk/docker/zap-rules.tsv'
          allow_issue_writing: false
          fail_action: true

      - name: Tear down DAST stack
        if: always()
        run: docker compose down -v

  # Aggregate gate: keeps the `docker` check name for branch protection while
  # the halves above run in parallel (or skip on docs-only changes). Fails
  # when either half really failed — skips are fine, cancellations are not.
  docker:
    runs-on: ubuntu-24.04
    name: docker
    needs: [image-scan, smoke-dast]
    if: always()
    steps:
      - run: |
          scan='${{ needs.image-scan.result }}'
          smoke='${{ needs.smoke-dast.result }}'
          echo "image-scan=$scan smoke-dast=$smoke"
          if [ "$scan" = success ] && [ "$smoke" = success ]; then exit 0; fi
          if [ "$scan" = skipped ] && [ "$smoke" = skipped ]; then
            echo 'docs-only change: nothing docker-related to verify'
            exit 0
          fi
          exit 1

  # Real-browser E2E (Playwright/Chromium): the behaviours raw HTTP cannot
  # see — no-JS form paths, inline-handler absence in a live DOM, mid-reveal
  # UI state. Same MariaDB service as the PHP suite; the app boots via
  # `php -S` (playwright.config.js webServer) against an isolated
  # deaddrops_e2e database seeded by e2e/global-setup.js, so the PHP and
  # browser harnesses never observe each other's rows.
  e2e:
    runs-on: ubuntu-24.04
    name: e2e (Playwright/Chromium)
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DDMGMT_DB_HOST: 127.0.0.1
      DDMGMT_DB_PORT: '3306'
      DDMGMT_DB_USER: root
      DDMGMT_DB_PASS: root
      DDMGMT_TEST_DB: deaddrops_e2e
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, openssl, gd, fileinfo

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Prepare config
        run: cp config.php.example config.php

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test
