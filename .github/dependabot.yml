version: 2
# Every ecosystem targets `dev`: master is protected and only receives
# dev via release PRs, so bumps opened against master would bypass the
# normal flow and leave dev behind.
updates:
  # CI actions drift too — a compromised or outdated action version is a
  # supply-chain risk like any other dependency. Dependabot understands
  # SHA-pinned references and proposes the pinned form of the new version.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  # Dev-only tooling (php-code-coverage). Runtime is dependency-free by
  # design (ADR-001) — this keeps the tooling honest anyway.
  - package-ecosystem: composer
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  # Browser-test runner. Without this entry @playwright/test is never bumped.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  # Docker base images (php:8.5-apache, php:8.5-fpm): security patches land
  # in the Debian layers constantly, and the Grype gate holds the built
  # images to them. The digest-pinned Semgrep container lives in a workflow
  # `container:` block, which the docker ecosystem does not cover — bump it
  # together with the weekly actions updates.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]

  # Service images in the compose files (mariadb, nginx, caddy), pinned by
  # digest like the Dockerfile bases — without this entry nothing would ever
  # propose their security updates.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
