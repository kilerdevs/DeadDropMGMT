; Runtime PHP settings for the DeadDropMGMT containers (Apache and FPM).
; The stock image ships NO php.ini, so PHP's built-in defaults applied — and
; several of them contradict limits the application itself advertises:
;
;   memory_limit        128M -> the photo pipeline caps images at 16 MP, whose
;                               decode + resample needs ~128 MB on its own
;   upload_max_filesize 2M   -> phone photos are 3-12 MB; the app's own cap
;                               (max_photo_mb, up to 5) applies AFTER re-encode
;   post_max_size       8M   -> an over-limit POST arrives EMPTY and surfaces
;                               as a baffling "invalid CSRF token"
;   session.gc_maxlifetime 1440 -> admin sessions died after ~24 min idle
;                               whatever admin_session_hours said (and the
;                               random GC made the real lifetime unpredictable)
;
; Keep post_max_size in step with the front servers' body limits
; (docker/nginx.conf client_max_body_size, docker/Caddyfile max_size).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 100

; Longer than the longest configurable admin idle window (5 h).
session.gc_maxlifetime = 21600
session.gc_probability = 1
session.gc_divisor = 100
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
