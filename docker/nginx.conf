# nginx front for the PHP-FPM variant. Mirrors the protections the Apache
# .htaccess enforces: includes/, logs/, cron/, config.php and dotfiles denied,
# everything else served statically, PHP handed to the fpm container.
# TLS is not terminated here — put a reverse proxy / LB with certs in front.

# Access logs keep the path only ($uri, no query string): old delivery links
# carry the order token as ?token=…, and no referer is recorded either.
log_format ddmgmt '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log ddmgmt;


    root /var/www/html;
    index index.php index.html;

    # .htaccess equivalents (cache/ holds tile PNGs served only via the
    # authenticated tile_proxy.php — direct URLs bypass the admin gate)
    location ~* ^/(includes|logs|cron|tools|cache|data|docker|e2e|tests|backups)/ { deny all; }
    location = /config.php                    { deny all; }
    # Map zone files are served by their secret names only (zone_<id>_<token>);
    # the old guessable names and half-finished downloads never are.
    location ~* ^/tiles/zone_[0-9]+\.(pmtiles|part)$ { deny all; }
    location ~* ^/tiles/.*\.(part|plan|tiles|tmp)$  { deny all; }
    location ~* ^/(setup\.sql|build-info\.json|composer\.(json|lock)|package(-lock)?\.json|playwright\.config\.js|phpstan\.neon|auto-update\.(sh|log)|config\.php\.example|Dockerfile.*|docker-compose.*\.yml)$ { deny all; }
    location ~ /\.(?!well-known)              { deny all; }

    # Uploaded images must never reach PHP-FPM, whatever their name is.
    location ~* ^/uploads/.+\.(php|phtml|phar)$ { deny all; }

    # Uploaded URLs are unguessable-but-bearer capability links: keep them out
    # of disk/shared caches. Plain prefix (no ^~) so the .php-deny regex above
    # still wins for executable names; images are served statically with the
    # hardened cache policy.
    location /uploads/ {
        # Static uploads never pass through PHP's header layer. Headers are
        # set per location only: a location-level add_header would silently
        # drop any server-level ones.
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    client_max_body_size 64m;   # photo uploads; keep >= php post_max_size (docker/php-ddmgmt.ini)

    location / {
        # Static files (CSS/JS/fonts) bypass PHP's header layer too.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass fpm:9000;
        fastcgi_read_timeout 60s;   # GD recompression of oversized photos
    }
}
