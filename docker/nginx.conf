# nginx front for the PHP-FPM variant. Mirrors the protections the Apache
# .htaccess enforces: includes/, logs/, cron/, config.php and dotfiles denied,
# everything else served statically, PHP handed to the fpm container.
# TLS is not terminated here — put a reverse proxy / LB with certs in front.

# Access logs keep the path only ($uri, no query string): old delivery links
# carry the order token as ?token=…, and no referer is recorded either.
log_format ddmgmt '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log ddmgmt;


    root /var/www/html;
    index index.php index.html;

    # .htaccess equivalents (cache/ holds tile PNGs served only via the
    # authenticated tile_proxy.php — direct URLs bypass the admin gate)
    location ~* ^/(includes|logs|cron|tools|cache|data|docker|e2e|tests|backups)/ { deny all; }
    location = /config.php                    { deny all; }
    # Map zone files are served by their secret names only (zone_<id>_<token>);
    # the old guessable names and half-finished downloads never are.
    location ~* ^/tiles/zone_[0-9]+\.(pmtiles|part)$ { deny all; }
    location ~* ^/tiles/.*\.(part|plan|tiles|tmp|leaves)$  { deny all; }
    # Zone uploads land under server-generated .pmtiles names only, but the
    # directory is app-writable: nothing PHP-ish under /tiles/ ever reaches
    # FPM (regex order matters — this must precede the .php handler below).
    location ~* ^/tiles/.+\.(php|phtml|phar)$ { deny all; }
    # INSTALL_UNLOCK holds the installer's rotating upgrade token: never serve.
    location ~* ^/(setup\.sql|build-info\.json|composer\.(json|lock)|package(-lock)?\.json|playwright\.config\.js|phpstan\.neon|auto-update\.(sh|log)|config\.php\.example|Dockerfile.*|docker-compose.*\.yml|INSTALL_UNLOCK)$ { deny all; }
    location ~ /\.(?!well-known)              { deny all; }

    # Uploaded images must never reach PHP-FPM, whatever their name is.
    location ~* ^/uploads/.+\.(php|phtml|phar)$ { deny all; }

    # Uploaded URLs are unguessable-but-bearer capability links: keep them out
    # of disk/shared caches. Plain prefix (no ^~) so the .php-deny regex above
    # still wins for executable names; images are served statically with the
    # hardened cache policy.
    location /uploads/ {
        # Static uploads never pass through PHP's header layer. Headers are
        # set per location only: a location-level add_header would silently
        # drop any server-level ones.
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    client_max_body_size 512m;   # manual zone-file uploads (100s of MiB); keep >= php post_max_size (docker/php-ddmgmt.ini)

    # Long-lived immutable assets: vendored libs, fonts/glyphs and zone
    # archives. Zone .pmtiles get fresh secret names per build and glyphs
    # never change, so a year is safe. Uploads stay no-store (bearer URLs);
    # HTML/PHP untouched. (Single Cache-Control header, not expires+: two
    # sources would emit it twice.)
    location ~* ^/(maplibre|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* ^/admin/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* ^/tiles/.+\.pmtiles$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Bandwidth for recipients on phones: compress text assets (maplibre-gl.js
    # 1 MB -> ~265 KB). Uploads (JPEG/PNG) and .pmtiles are already
    # compressed — and gzip breaks Range requests — so their MIME types stay
    # out of gzip_types; text/html is always compressed when gzip is on.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        # Static files (CSS/JS/fonts) bypass PHP's header layer too.
        add_header X-Content-Type-Options "nosniff" always;
        # ?v=-busted first-party assets (asset_ver() changes the URL on
        # every edit): cache for a year. The nosniff repeat is required —
        # headers set inside if() replace the location-level ones.
        if ($arg_v != "") {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass fpm:9000;
        fastcgi_read_timeout 60s;   # GD recompression of oversized photos
    }
}
