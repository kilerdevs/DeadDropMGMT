# Quiet the FQDN warning inside containers (no resolvable hostname there)
ServerName localhost

# ZAP 10036: don't advertise server/version information
ServerTokens Prod
ServerSignature Off

# AllowOverride All so the shipped .htaccess rules (routing, blocking of
# includes/, config.php, logs/, cron/) take effect under Apache.
<Directory /var/www/html>
    AllowOverride All
</Directory>

# The app never terminates TLS; terminate it in front (reverse proxy / LB).

# Access logs record the path only: delivery links used to carry the order
# token as ?token=… (old links still do), and a query string in a log line
# outlives every wipe. Redefining "combined" here (conf-enabled loads before
# the site that references it) also drops the Referer column.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"-\" \"%{User-Agent}i\"" combined
